services:
  # Published only in dev, for connecting with psql/redis-cli/a GUI client
  # from the host while testing. Production keeps these unpublished.
  timescaledb:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  migrate:
    image: perp-migrate:dev
    build:
      context: .
      target: migrator

  engine:
    image: perp-engine:dev
    build:
      context: .
      target: runtime
      args:
        APP: engine

  backend:
    image: perp-backend:dev
    build:
      context: .
      target: runtime
      args:
        APP: backend
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"

  web-socket-server:
    image: perp-web-socket-server:dev
    build:
      context: .
      target: runtime
      args:
        APP: web-socket-server
    ports:
      - "${WS_PORT:-3001}:${WS_PORT:-3001}"

  db-poller:
    image: perp-db-poller:dev
    build:
      context: .
      target: runtime
      args:
        APP: db-poller

  price-feed:
    image: perp-price-feed:dev
    build:
      context: .
      target: runtime
      args:
        APP: price-feed

  market-maker:
    image: perp-market-maker:dev
    build:
      context: .
      target: market-maker
