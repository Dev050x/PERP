name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
        run: bunx prisma generate

      - name: Type check
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Unit + integration tests
        working-directory: apps/test
        run: bun test

      - name: Dependency audit
        continue-on-error: true
        run: bun audit

  docker-build:
    
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend,           target: runtime,      app: backend }
          - { name: engine,            target: runtime,      app: engine }
          - { name: db-poller,         target: runtime,      app: db-poller }
          - { name: web-socket-server, target: runtime,      app: web-socket-server }
          - { name: price-feed,        target: runtime,      app: price-feed }
          - { name: migrate,           target: migrator,     app: "" }
          - { name: market-maker,      target: market-maker, app: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3


      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            APP=${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=perp-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=perp-${{ matrix.name }}
