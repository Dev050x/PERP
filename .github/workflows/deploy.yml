name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: backend,           target: runtime,  app: backend }
          - { name: engine,            target: runtime,  app: engine }
          - { name: db-poller,         target: runtime,  app: db-poller }
          - { name: web-socket-server, target: runtime,  app: web-socket-server }
          - { name: price-feed,        target: runtime,  app: price-feed }
          - { name: migrate,           target: migrator,     app: "" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            APP=${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/perp-${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.value }}/perp-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=perp-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=perp-${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USERNAME,GHCR_PAT
          script_stops: true
          script: |
            set -euo pipefail
            cd /opt/perp
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export IMAGE_TAG
            docker compose --profile proxy pull
            docker compose --profile proxy up -d --remove-orphans
            docker image prune -f
            docker compose ps
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
